<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo icon -->
  <rect x="480" y="120" width="72" height="72" rx="18" fill="url(#logoGrad)"/>
  <g transform="translate(480,120)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 10L10 22l26 13 26-13-26-13z" fill="white" stroke="none"/>
    <path d="M10 38l26 13 26-13" stroke-width="3.5" opacity="0.85"/>
    <path d="M10 50l26 13 26-13" stroke-width="3.5" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="600" y="256" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2">LuxiPanel</text>

  <!-- Subtitle -->
  <text x="600" y="316" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="400" fill="#6b7280" text-anchor="middle">Panel de administración moderno de servidores de correo</text>

  <!-- Feature pills -->
  <g transform="translate(600, 390)">
    <!-- Mail -->
    <rect x="-340" y="0" width="140" height="38" rx="19" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
    <text x="-270" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">✉ Correo</text>

    <!-- Monitor -->
    <rect x="-170" y="0" width="150" height="38" rx="19" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
    <text x="-95" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">◎ Monitor</text>

    <!-- DNS -->
    <rect x="-0" y="0" width="120" height="38" rx="19" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
    <text x="60" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">⊙ DNS</text>

    <!-- SSL -->
    <rect x="140" y="0" width="120" height="38" rx="19" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
    <text x="200" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">🔒 SSL</text>

    <!-- AI -->
    <rect x="280" y="0" width="100" height="38" rx="19" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
    <text x="330" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">🤖 IA</text>
  </g>

  <!-- Version badge -->
  <rect x="547" y="470" width="106" height="30" rx="8" fill="#10b98120" stroke="#10b98150" stroke-width="1"/>
  <text x="600" y="490" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#10b981" text-anchor="middle">v2.0</text>

  <!-- Bottom border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#logoGrad)" opacity="0.6"/>
</svg>
