minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@tolqia/*'
  - '@react-native/*'
  - react-native
  - react-native-*
  - '@expo/*'
  - expo
  - expo-*
allowBuilds:
  esbuild: true
  '@swc/core': true
  expo: true
  expo-modules-core: true
  '@parcel/watcher': true
  unrs-resolver: true
  es5-ext: false
  core-js: false
  protobufjs: true
  '@firebase/util': false
  dtrace-provider: true
packageManagerStrict: true
packageManagerStrictVersion: false
engineStrict: true
verifyDepsBeforeRun: warn
preferFrozenLockfile: true
autoInstallPeers: false
strictPeerDependencies: false
dedupePeerDependents: true
resolutionMode: highest
shamefullyHoist: true
overrides:
  '@tolqia/contracts': file:vendor/tolqia-contracts-1.2.0.tgz
  undici: ^6.28.1
  postcss: ^8.5.18
  uuid: '>=11.1.1'
  ws: '>=8.20.1'
  tar: '>=7.5.21'
  shell-quote: '>=1.8.5'
  websocket-driver: '>=0.7.5'
  node-forge: '>=1.4.0'
  minimatch: '>=5.1.8'
  '@xmldom/xmldom': 0.8.15
  ajv: '>=8.18.0'
  diff: '>=8.0.3'
  yaml: '>=2.8.3'
  '@grpc/grpc-js@>=1.9 <1.10': ~1.9.16
  protobufjs: ^7.6.1
  brace-expansion@>=4 <6: ^5.0.9
  js-yaml@>=3 <4: ^3.15.2
  js-yaml@>=4 <5: ^4.3.2
  nanoid@>=3 <4: ^3.3.18
  fast-uri@>=3 <4: ^3.1.7
  browserslist: ^4.28.7
  image-size: 2.0.3
patchedDependencies:
  '@xterm/headless@6.0.0': patches/@xterm__headless@6.0.0.patch
  metro@0.83.3: patches/metro@0.83.3.patch
  metro@0.83.7: patches/metro@0.83.7.patch
