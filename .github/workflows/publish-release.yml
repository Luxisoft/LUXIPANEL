name: Publish combined release
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Luxisoft/LUXIPANEL' && github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix/')) && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.5.0 --activate
      - run: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run build
        working-directory: web/backend
        env:
          NODE_OPTIONS: --max-old-space-size=2560
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=2560
      - run: node scripts/build-release-bundle.mjs --verify
        working-directory: web
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - run: git config credential.helper '!gh auth git-credential'
      - run: python3 scripts/publish-release.py
        working-directory: web
        env:
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
          LP_REVIEW_URL: ${{ vars.LP_REVIEW_URL }}
          RUNNER_REVIEW_TOKEN: ${{ secrets.RUNNER_REVIEW_TOKEN }}
