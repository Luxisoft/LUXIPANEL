name: Prepare combined release
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Module review relay, Developer checks, Hotfix checks, Publish combined release]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, bootstrap, hotfix]
        default: auto
      pull_request:
        description: Merged developer PR to replay on the latest stable version
        type: string
      module_version_ids:
        description: Approved module version UUIDs instead of a core PR (comma separated)
        type: string
permissions:
  contents: read
concurrency:
  group: combined-release
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'Luxisoft/LUXIPANEL' && github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' && github.ref == 'refs/heads/lxp/release-next'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 web/scripts/combined-release.py
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_MODE: bootstrap
  prepare:
    if: github.repository == 'Luxisoft/LUXIPANEL' && github.ref == 'refs/heads/main' && inputs.mode != 'bootstrap' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: git config credential.helper '!gh auth git-credential'
      - run: python3 web/scripts/combined-release.py
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_MODE: ${{ inputs.mode || 'auto' }}
          HOTFIX_PR: ${{ inputs.pull_request }}
          HOTFIX_VERSION_IDS: ${{ inputs.module_version_ids }}
          LP_REVIEW_URL: ${{ vars.LP_REVIEW_URL }}
          RUNNER_REVIEW_TOKEN: ${{ secrets.RUNNER_REVIEW_TOKEN }}
