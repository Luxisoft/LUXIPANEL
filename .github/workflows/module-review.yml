name: Module review
on:
  pull_request:
    branches: [modules]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  static-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.5.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web/backend
      - run: python3 scripts/install-review-tools.py
        working-directory: web
      - run: python3 scripts/module-review-relay.py --static
        working-directory: web
        env:
          MODULE_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_HEAD_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
